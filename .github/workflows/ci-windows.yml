name: Windows build and tests

on:
  pull_request:
    branches: [main, dev, refactoring]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        pch: ['ON', 'OFF']
        configuration: ['Debug', 'Release']
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.51.0'

      - name: Check justfile formatting
        run: just --fmt --check

      - name: Install Qt and matching MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qt5compat qtnetworkauth qtsvg qttools
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Check committed translations
        run: just translations-check

      - name: Configure
        shell: pwsh
        run: >-
          just build_dir=build
          config=${{ matrix.configuration }}
          pch=${{ matrix.pch }} configure
          -DCMAKE_CXX_COMPILER=g++.exe

      - name: Build desktop, console CLI, and tests
        run: just build_dir=build config=${{ matrix.configuration }} build

      - name: Run authorization, C++, QML, and CLI process tests
        run: just build_dir=build config=${{ matrix.configuration }} test

      - name: Exercise console CLI recipe
        run: just build_dir=build config=${{ matrix.configuration }} cli --help --json

      - name: Check installed console CLI
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          just build_dir=build config=Release install
          if ($LASTEXITCODE -ne 0) { throw 'Deployment failed' }
          $cli = Get-ChildItem build/stage -Recurse -File -Filter YandexHomeCli.exe | Select-Object -First 1
          if (-not $cli) { throw 'Missing installed console CLI' }
          cmake "-DAPP_PATH=$($cli.FullName)" -DCONFIGURATION=Release -P tests/CliSmoke.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Installed console CLI failed' }
