name: Linux Release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Linux Release
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
        with:
          just-version: '1.51.0'

      - name: Check justfile formatting
        run: just --fmt --check

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          host: linux

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0

      - name: Build, test, and package Linux desktop and console applications
        run: >-
          just desktop=ON package_build_dir=build generator=Ninja pch=ON spix=OFF
          package-linux -DCMAKE_CXX_COMPILER=g++-13

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: yandex-home-linux-x86_64
          path: build/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Smoke-test the Linux desktop window
        run: |
          just desktop=ON config=Release build_dir=build spix=ON configure -DYH_ENABLE_PACKAGING=OFF
          just desktop=ON config=Release build_dir=build spix=ON test-e2e SpixSmoke

      - name: Upload linux test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-report
          path: build/test-reports/
          retention-days: 7

      - name: Check C++ formatting and clang-tidy configuration
        run: |
          python -m pip install --only-binary=:all: -r requirements-clang-tools.txt
          just format-check
          clang-tidy --verify-config

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            build/Testing/Temporary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
