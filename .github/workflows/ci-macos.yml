name: macOS Release build

on:
  pull_request:
    branches: [main, dev, refactoring]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS Release
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
        with:
          just-version: '1.51.0'

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          host: mac

      - name: Exercise recovery from a stale dependency source override
        run: |
          mkdir -p build
          printf 'FETCHCONTENT_SOURCE_DIR_QHOTKEY:PATH=%s/missing-qhotkey-source\n' "$RUNNER_TEMP" > build/CMakeCache.txt

      - name: Build, test, and package macOS installer
        run: >-
          just package_build_dir=build generator=Ninja pch=ON jobs=3
          package-macos -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: yandex-home-macos-arm64
          path: build/dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            build/Testing/Temporary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
