name: Linux build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qttools qthttpserver qtwebsockets
          cache: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DESKTOP_APP=OFF -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Stage shared libraries, headers, and console applications
        run: cmake --install build --prefix stage
      - uses: actions/upload-artifact@v4
        with:
          name: yandex-home-linux
          path: stage/
