name: Windows Release build

on:
  pull_request:
    branches: [main, dev, refactoring]
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the full Debug suite, including Spix end-to-end tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows Release
    runs-on: windows-2022
    env:
      QT_FORCE_STDERR_LOGGING: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.51.0'

      - name: Check justfile formatting
        run: just --fmt --check

      - name: Select Git Bash for recipes (Bash 3.2+)
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path "$bashDirectory\bash.exe")) { throw 'Git Bash is required' }
          $bashDirectory >> $env:GITHUB_PATH

      - name: Install Qt and matching MinGW
        uses: ./.github/actions/setup-qt
        with:
          host: windows

      - name: Install pinned NSIS
        run: choco install nsis --version=3.12.0 --no-progress -y

      - name: Build and smoke-test the opt-in Spix desktop
        shell: pwsh
        run: |
          $profile = @('config=Release', 'spix=ON', 'cli_app=OFF', 'rest_app=OFF')
          $options = @('-DCMAKE_CXX_COMPILER=g++.exe', '-DBUILD_SHORTCUTS_APP=OFF')
          just @profile configure @options
          if ($LASTEXITCODE -ne 0) { throw 'Spix configuration failed' }
          # Reproduce the copy timestamp collision even on a slower runner.
          $deps = 'build-just/release/_deps'
          $original = Get-Item "$deps/spix-src/libs/Core/src/AnyRpcServer.cpp"
          $patched = Get-Item "$deps/spix-build/patched/libs/Core/src/AnyRpcServer.cpp"
          $patched.LastWriteTimeUtc = $original.LastWriteTimeUtc
          just @profile configure @options -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          if ($LASTEXITCODE -ne 0) { throw 'Offline Spix reconfiguration failed' }
          just @profile test-e2e SpixSmoke
          if ($LASTEXITCODE -ne 0) { throw 'Spix smoke test failed' }

      - name: Upload Spix smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spix-test-reports
          path: build-just/release/test-reports/
          retention-days: 7

      - name: Check build ZIP recipe
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'archive fixture'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Set-Content (Join-Path $fixture 'CMakeCache.txt') 'archive smoke test'
          just "build_dir=$fixture" archive-build
          if ($LASTEXITCODE -ne 0) { throw 'Build archive creation failed' }
          $archive = (Get-ChildItem dist/build-archives -Filter '*.zip' -File).FullName
          $entries = cmake -E tar tf $archive
          if ($LASTEXITCODE -ne 0 -or -not ($entries -match '(^|/)archive fixture/CMakeCache\.txt$')) { throw 'Expected CMakeCache.txt in build ZIP' }

      - name: Exercise recovery from a stale dependency source override
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-just/package -Force | Out-Null
          Set-Content build-just/package/CMakeCache.txt "FETCHCONTENT_SOURCE_DIR_QHOTKEY:PATH=$env:RUNNER_TEMP/missing-qhotkey-source"

      - name: Build, test, and package Windows installer
        run: >-
          just generator=Ninja pch=ON
          package-windows '-DCMAKE_CXX_COMPILER=g++.exe'

      - name: Smoke-check the silent installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build-just/package/dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $installed = Join-Path $env:RUNNER_TEMP 'package installed'
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installed" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Silent installer failed' }
          cmake "-DPACKAGE_ROOT=$installed" -P build-just/package/CheckPackage.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Installed package verification failed' }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: yandex-home-windows-x86_64
          path: build-just/package/dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload windows test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-report
          path: build-just/package/test-reports/
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build-just/package/Testing/Temporary/*.log
            build-just/package/Testing/*.txt
            build-just/*/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7

  full-tests:
    name: Windows Debug full test suite
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.full_tests) ||
      (github.event_name == 'pull_request' && vars.CI_FULL_TESTS == 'true')
    runs-on: windows-2022
    env:
      QT_FORCE_STDERR_LOGGING: '1'
      YH_JUST_BUILD_DIR: build-just/full-tests
      YH_JUST_CONFIG: Debug
      YH_JUST_SPIX: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.51.0'

      - name: Select Git Bash for recipes (Bash 3.2+)
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path "$bashDirectory\bash.exe")) { throw 'Git Bash is required' }
          $bashDirectory >> $env:GITHUB_PATH

      - name: Install Qt and matching MinGW
        uses: ./.github/actions/setup-qt
        with:
          host: windows

      - name: Install pinned FFmpeg for Spix playback
        run: choco install ffmpeg --version=7.1.1 --allow-downgrade --no-progress -y

      - name: Configure Debug desktop with Spix
        run: just configure '-DCMAKE_CXX_COMPILER=g++.exe'

      - name: Run all Debug test suites and record Spix playback
        id: run-tests
        run: just tests-run --all --record

      - name: Upload full test report
        if: ${{ !cancelled() && steps.run-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-test-report
          path: build-just/full-tests/test-reports/
          retention-days: 7
