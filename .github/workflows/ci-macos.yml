name: macOS build and tests

on:
  pull_request:
    branches: [main, dev, refactoring]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
        with:
          just-version: '1.51.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat qtnetworkauth qtsvg qttools qthttpserver qtwebsockets qtmultimedia
          cache: true

      - name: Exercise recovery from a stale dependency source override
        run: |
          mkdir -p build
          printf 'FETCHCONTENT_SOURCE_DIR_QHOTKEY:PATH=%s/missing-qhotkey-source\n' "$RUNNER_TEMP" > build/CMakeCache.txt

      - name: Build, test, and package macOS installer
        run: >-
          just package_build_dir=build jobs=2 package-macos
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}
