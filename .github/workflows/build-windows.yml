name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.4.0

      - name: Install Qt 6.9.1
        uses: jurplel/install-qt-action@v4.3.0
        with:
          aqtversion: '==3.3.0'
          version: '6.9.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qt5compat qtnetworkauth qtshadertools qtsvg qttools'
          cache: true

      - name: Check committed translations
        run: |
          python scripts/update-data-translation-markers.py --check
          python scripts/check-translations.py

      - name: Configure from a clean checkout
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build
          path: build/Release/YandexHomeDesktop.exe
          if-no-files-found: error
